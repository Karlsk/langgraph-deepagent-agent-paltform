version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg17
    platform: linux/amd64
    env_file:
      - .env.${APP_ENV:-development}
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ 延迟到容器运行时展开（取 env_file 注入的值），
      # 避免 compose 插值在缺少根级 .env 时得到空用户名
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - monitoring

  # Valkey (Redis-compatible) cache — optional, set VALKEY_HOST=valkey in your .env to enable
  valkey:
    image: valkey/valkey:8.1.6-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - monitoring

  # One-shot Alembic migration. Exits after `alembic upgrade head`; the app
  # service waits for this via `service_completed_successfully` so its lifespan
  # bootstrap (which queries provider/model_config tables) never races against
  # a schema-less database. Idempotent: re-running on an up-to-date head is a
  # no-op. `restart: "no"` keeps it from looping forever on a broken schema.
  migrate:
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV:-development}
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    env_file:
      - .env.${APP_ENV:-development}
    environment:
      - APP_ENV=${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - monitoring

  # Single API service with dynamic environment
  app:
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      # stdio MCP manifest directory: drop *.json manifests on the host and
      # sync them via POST /mcp-servers/stdio-sync (see mcp-servers/README.md)
      - ./mcp-servers:/app/mcp-servers
      # Skills filesystem store (SKILLS_ROOT=./data/skills): without this bind
      # mount, SKILL.md bodies created at runtime live only in the container
      # layer and are lost on every rebuild while their DB metadata rows
      # survive in the postgres volume (read_global then fails "not found").
      - ./data:/app/data
    env_file:
      - .env.${APP_ENV:-development}
    environment:
      - APP_ENV=${APP_ENV:-development}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supersecretkeythatshouldbechangedforproduction}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    networks:
      - monitoring

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - monitoring
    restart: always

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    restart: always

networks:
  monitoring:
    driver: bridge

volumes:
  grafana-storage:
  postgres-data:
  valkey-data:

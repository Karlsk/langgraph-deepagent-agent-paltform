# 所需环境变量：无（mock_enabled 仅演示用途，不会发起真实网络请求；
# 生产使用请关闭 mock 并配置真实端点，见 README 扩展指南）
workflow_id: demo_http
description: "HTTP 节点示例：mock_enabled 演示（S9 显式开关，零网络）"
entry_point: fetch
nodes:
  - name: fetch
    type: http
    config:
      url: "https://example.com/api/items"
      method: POST
      body_template: '{"query": "{input}"}'
      response_path: "data"
      mock_enabled: true
      mock_responses:
        # 键格式："{method} {url}"（或仅 url 作为回退）
        "POST https://example.com/api/items": '{"data": {"items": ["alpha", "beta"]}}'
edges:
  - source: fetch
    target: END
state_schema:
  input:
    type: str
    description: 查询字符串

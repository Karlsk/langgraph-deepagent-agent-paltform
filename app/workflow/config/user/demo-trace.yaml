workflow_id: demo-trace
entry_point: ask
nodes:
- name: ask
  type: llm
  config:
    provider_ref: default/default
    model_name: MiniMax-M3
    llm_type: openai
    system_prompt: 用一句中文简短回答。
    temperature: 0.0
    max_retries: 1
    retry_base_delay: 1.0
- name: fetch
  type: http
  config:
    url: http://127.0.0.1/api
    method: GET
    mock_enabled: true
    mock_responses:
      GET http://127.0.0.1/api: '{"status":"mocked-ok","items":3}'
    response_path: ''
    timeout: 30.0
    max_retries: 0
    retry_base_delay: 1.0
edges:
- source: ask
  target: fetch
  condition: null
- source: fetch
  target: END
  condition: null
state_schema:
  messages:
    type: list
    default: null
    description: 对话消息
    reducer: null
ui_layout:
  nodes:
    ask:
      x: 60
      y: 120
    fetch:
      x: 320
      y: 120
operator_logs:
  ask:
    node_name: ask
    input_schema: {}
    output_schema: {}
  fetch:
    node_name: fetch
    input_schema: {}
    output_schema: {}

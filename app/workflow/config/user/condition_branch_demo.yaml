workflow_id: condition_branch_demo
entry_point: check
nodes:
- name: check
  type: llm
  config:
    llm_type: openai
    model_name: MiniMax-M3
    temperature: 0
    system_prompt: 判断输入是否需要人工复核：涉及金额、法律、医疗或投诉时需要。 只输出一个单词：需要复核输出 NEED_REVIEW，否则输出
      OK。 不要输出任何其他文字、标点或解释。
    provider_ref: default/default
- name: notify
  type: http
  config:
    url: https://example.com/api/notify
    method: POST
    body_template: '{"input": "{input}"}'
    response_path: result
    mock_enabled: true
    mock_responses:
      POST https://example.com/api/notify: '{"result": {"ticket": "DEMO-1"}}'
- name: summarize
  type: llm
  config:
    llm_type: openai
    model_name: MiniMax-M3
    system_prompt: You are a concise assistant. Summarize the input in one sentence.
    provider_ref: default/default
    temperature: 0.7
edges:
- source: check
  target: notify
  condition: check_result.response == 'OK'
- source: check
  target: summarize
  condition: check_result.response == 'NEED_REVIEW'
- source: notify
  target: END
  condition: null
- source: summarize
  target: END
  condition: null
state_schema:
  input:
    type: str
    default: null
    description: 用户输入（用于 notify 的 body_template 渲染）
    reducer: null
  messages:
    type: list
    default: null
    description: 'langchain 消息列表，如 [{"role": "user", "content": "please review"}]'
    reducer: null
ui_layout:
  nodes:
    check:
      x: 0
      y: 0
    notify:
      x: 200
      y: 0
    summarize:
      x: 400
      y: 0
operator_logs:
  check:
    node_name: check
    input_schema: {}
    output_schema: {}
  notify:
    node_name: notify
    input_schema: {}
    output_schema: {}
  summarize:
    node_name: summarize
    input_schema: {}
    output_schema: {}

# =============================================================================
# SDN 接口告警巡检工作流（核心流程，引擎零改动移植）
#
# 流程：get_token → extract_token → get_alerts → prepare_check
#        → [pe_info → pick_vendor → command_exec → parse_result] 循环
#        → prep → llm_summary → report → END
# 循环由 YAML 条件回边表达（parse_result → prepare_check，has_next == 'true'）；
# 零告警时 prepare_check 经 "current_device == ''" 条件边直接短路到 prep。
#
# 凭据约定（定稿决策 5）：
#   - 本文件为入库模板，凭据为占位符；
#   - 复制为 sdn_alert_inspection.yaml（已加 .gitignore，不入库）后填入真实值。
# SSL：SDN 控制器自签证书；引擎 HTTPNode verify_ssl=False 已默认关闭。
# recursion_limit：每条告警循环 5 步，入口已 set_recursion_limit(200)。
#
# 数据流（dual_write=False + Dify-style inputs 统一模式）：
#   - 节点输出仅写入 {node_name}_result，不再展开到顶层 state
#   - Python 节点通过 inputs 声明 dot-path 映射，代码写 def main(**inputs)
#   - parse_result 手动累积检查结果（读自身上一轮的 accumulated_checks）
#   - state_keys: [has_next] 直通条件路由字段到 state channel
#
# 运行（零传参，凭据取 state_schema.default）：
#   uv run python -m app.sdn run --workflow sdn_alert_inspection --input '{}'
# 注意：DEBUG 级日志会输出 http 节点完整响应（含 token），验证请用默认 INFO 级。
# =============================================================================
workflow_id: sdn_alert_inspection
description: 'SDN interface alert inspection: token -> alerts -> per-alert device check loop -> LLM report'
entry_point: get_token

state_schema:
  # --- 凭据（模板占位；真实值写不入库的 sdn_alert_inspection.yaml）---
  sdn_base_url:
    type: str
    default: 'https://sdn-controller.example.com'
    description: 'SDN controller base URL (no trailing slash)'
  sdn_username:
    type: str
    default: 'CHANGE_ME_USERNAME'
    description: 'SDN controller login username'
  sdn_password:
    type: str
    default: 'CHANGE_ME_PASSWORD'
    description: 'SDN controller login password'
  sdn_device_id:
    type: str
    default: 'CHANGE_ME_DEVICE_ID'
    description: 'Client device id registered with the controller'
  # --- 条件路由字段（state_keys 直通）---
  has_next:
    type: str
    reducer: last
    description: "Loop marker: 'true' / 'false' (S7 equality condition)"
  messages:
    type: list
    reducer: last

nodes:
  # 1. 取 token（内置 HTTPNode，凭据从 state 模板渲染）
  - name: get_token
    type: http
    config:
      url: '{sdn_base_url}/oauth/token'
      method: POST
      headers:
        Content-Type: application/json
        Accept: application/json
      body_template: '{"username": "{sdn_username}", "password": "{sdn_password}", "device_id": "{sdn_device_id}"}'

  # 2. 解析 access_token（Dify-style inputs + def main）
  - name: extract_token
    type: python
    config:
      inputs:
        token_response: get_token_result.response
      code: |
        def main(token_response):
            return {"access_token": (token_response or {}).get("access_token", "")}
      sandboxed: true

  # 3. 查询告警列表（内置 HTTPNode，Bearer 从 dot-path 渲染）
  - name: get_alerts
    type: http
    config:
      url: '{sdn_base_url}/monitor/v2/alert/page'
      method: POST
      headers:
        Content-Type: application/json
        Accept: 'application/json, text/plain, */*'
        Authorization: 'Bearer {extract_token_result.access_token}'
      body_template: '{"interval": "1h", "namespace": "device", "category": "PE端口Down", "autoRecovery": 1, "pageNum": 1, "pageSize": 10}'

  # 4. 循环准备：首轮播种告警队列，随后每轮弹出队首写 current_*
  - name: prepare_check
    type: python
    config:
      inputs:
        prev_remaining: parse_result_result.remaining_alerts
        alerts_response: get_alerts_result.response
      code: |
        def main(prev_remaining, alerts_response):
            alerts = prev_remaining
            if not alerts:
                alerts = list((alerts_response or {}).get("data") or [])
            current_device = ""
            current_interface = ""
            current_down_time = ""
            rest = alerts
            if alerts:
                first, rest = alerts[0], alerts[1:]
                current_device = first.get("source", "")
                current_interface = first.get("component", "")
                current_down_time = first.get("time", "")
            return {
                "remaining_alerts": rest,
                "current_device": current_device,
                "current_interface": current_interface,
                "current_down_time": current_down_time,
            }
      sandboxed: true

  # 5. 查询设备厂商信息（内置 HTTPNode）
  - name: pe_info
    type: http
    config:
      url: '{sdn_base_url}/api/no/config/terra-pe:peInfos/page?pageNumber=1&pageSize=10'
      method: POST
      headers:
        Content-Type: application/json
        Authorization: 'Bearer {extract_token_result.access_token}'
      body_template: '{"name": "{prepare_check_result.current_device}"}'

  # 6. 解析厂商 + 按 VENDOR_COMMAND_MAP 组装命令 JSON
  - name: pick_vendor
    type: python
    config:
      inputs:
        pe_response: pe_info_result.response
        current_device: prepare_check_result.current_device
      code: |
        import json

        def main(pe_response, current_device):
            VENDOR_COMMAND_MAP = {"H3C": "dis ip in br", "Huawei": "dis ip in br"}
            DEFAULT_COMMAND = "dis ip in br"
            content = (pe_response or {}).get("content") or []
            vendor = content[0].get("vendor-id", "") if content else ""
            command = VENDOR_COMMAND_MAP.get(vendor, DEFAULT_COMMAND)
            body = json.dumps(
                {"device_name": current_device or "", "command": command},
                ensure_ascii=False,
            )
            return {"vendor_info": {"vendor_id": vendor}, "current_command": body}
      sandboxed: true

  # 7. 下发命令（内置 HTTPNode，body_template 整包渲染 current_command）
  - name: command_exec
    type: http
    config:
      url: '{sdn_base_url}/api/no/config/device-conf/command-result'
      method: POST
      headers:
        Content-Type: application/json
        Authorization: 'Bearer {extract_token_result.access_token}'
      body_template: '{pick_vendor_result.current_command}'

  # 8. 正则解析接口状态 + 设置循环标记（手动累积检查结果）
  - name: parse_result
    type: python
    config:
      inputs:
        raw_output: command_exec_result.response.result
        interface_name: prepare_check_result.current_interface
        prev_checks: parse_result_result.accumulated_checks
        vendor: pick_vendor_result.vendor_info.vendor_id
        current_device: prepare_check_result.current_device
        current_down_time: prepare_check_result.current_down_time
        prev_remaining: parse_result_result.remaining_alerts
      code: |
        import re

        IFACE_PATTERN = re.compile(
            r"^(\S+)\s+(\*?down|up)\s+(down|up(?:\(s\))?)\s+(\S+)\s+(\S+)\s*(.*)$",
            re.MULTILINE,
        )

        def extract_iface_number(name):
            m = re.search(r"(\d+/\d+/\d+(?:\.\d+)?)$", name)
            return m.group(1) if m else name

        def find_iface_status(raw_output, interface_name):
            target = extract_iface_number(interface_name)
            for match in IFACE_PATTERN.finditer(raw_output or ""):
                iface = match.group(1)
                if iface == interface_name or extract_iface_number(iface) == target:
                    physical, protocol = match.group(2), match.group(3)
                    ip_addr, description = match.group(4), match.group(6).strip()
                    status = (
                        f"Interface: {iface}, Physical: {physical}, "
                        f"Protocol: {protocol}, IP: {ip_addr}"
                    )
                    if description and description != "--":
                        status += f", Description: {description}"
                    return status
            return None

        def main(raw_output, interface_name, prev_checks, vendor, current_device, current_down_time, prev_remaining):
            check = list(prev_checks or [])
            status = find_iface_status(raw_output, interface_name or "")
            if status:
                check.append(
                    f"查看 {current_device or ''} 的 {interface_name or ''} 接口的状态: {status}, "
                    f"设备厂商: {vendor or '未知'}, 告警down时间: {current_down_time or ''}"
                )
            has_next = "true" if prev_remaining else "false"
            return {"accumulated_checks": check, "has_next": has_next}
      sandboxed: true
      state_keys:
        - has_next

  # 9. 汇总检查结果为 LLM messages（空则源码兜底文案）
  - name: prep
    type: python
    config:
      inputs:
        accumulated: parse_result_result.accumulated_checks
      code: |
        def main(accumulated):
            results = accumulated or []
            if results:
                lines = ["## Interface Alert Inspection Results", ""]
                for i, summary in enumerate(results, 1):
                    lines.append(f"{i}. {summary}")
                context = "\n".join(lines)
            else:
                context = "No interface inspection results available."
            return {"messages": [{"role": "user", "content": context}]}
      sandboxed: true

  # 10. LLM 汇总（内置 LLM 节点；key/base_url 走 env：OPENAI_API_KEY / OPENAI_BASE_URL）
  - name: llm_summary
    type: llm
    config:
      llm_type: openai
      model_name: MiniMax-M3  # 可按需替换为 gpt-4o-mini 等
      temperature: 0.3
      system_prompt: |
        You are an SDN network operations assistant generating part of an interface alert inspection report.
        You will receive interface inspection summaries from network devices. Each summary includes: device name, device vendor (e.g. H3C, Huawei), interface name, current physical/protocol status, and the alert DOWN time.

        Generate EXACTLY the following TWO markdown sections and nothing else:

        ## 2. 详细检测结果
        A markdown table with columns: 节点名称 | 设备厂商 | 检查项目 | 检测结果 | 备注
        - 检查项目 is always '端口状态检测'
        - 检测结果 uses '❌ 异常' for interfaces currently down, '✅ 正常' for interfaces that have recovered (up/up)
        - 备注 contains the interface name and the alert DOWN time

        ## 3. 处理建议
        A numbered list of concrete recommended actions for each abnormal interface.
        - Tailor suggestions to each device's vendor: use vendor-matching commands and features (e.g. for H3C/Huawei Comware use `display interface`, `dis ip interface brief`, `shutdown`/`undo shutdown`, optical transceiver and cable checks)
        - Include escalation advice if the interface does not recover

        Respond in Chinese. Output only the two markdown sections above, with no extra commentary.

  # 11. 固定报告头 + 故障判定 + 拼 LLM 正文
  - name: report
    type: python
    config:
      inputs:
        accumulated: parse_result_result.accumulated_checks
        llm_response: llm_summary_result.response
      code: |
        import random
        import re
        from datetime import datetime

        INSPECTION_SUMMARY = (
            "本次智能巡检覆盖全网核心链路及接入节点。系统对拓扑中的所有关键网元进行了连通性、性能及健康度扫描。"
            "巡检结果显示，核心骨干网运行平稳，各项指标均在正常范围内。"
            "如存在异常项，请参见下方详细检测结果，并结合处理建议及时处置。"
        )

        def detect_fault(check_result):
            for summary in check_result:
                m = re.search(r"Physical:\s*(\S+),\s*Protocol:\s*(\S+)", summary)
                if m and ("down" in m.group(1).lower() or "down" in m.group(2).lower()):
                    return True
            return False

        def main(accumulated, llm_response):
            check_result = accumulated or []
            has_fault = detect_fault(check_result)
            report_id = f"RP-{random.randint(10000000, 99999999)}"
            report_time = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
            overall = "⚠️ 异常检测 (Fault Detected)" if has_fault else "✅ 正常 (Normal)"
            header = (
                "# 网络智能巡检报告\n\n"
                "| 项目 | 内容 |\n"
                "|------|------|\n"
                f"| 报告编号 | {report_id} |\n"
                f"| 生成时间 | {report_time} |\n"
                "| 巡检单位 | 智能运维中心 (AIOps Center) |\n"
                f"| 整体状态 | {overall} |\n\n"
                f"## 1. 巡检综述\n\n{INSPECTION_SUMMARY}\n"
            )
            return {"report": f"{header}\n{(llm_response or '').strip()}\n"}
      sandboxed: true

edges:
  - source: get_token
    target: extract_token
  - source: extract_token
    target: get_alerts
  - source: get_alerts
    target: prepare_check
  # 循环入口分流：有告警进设备检查；零告警短路到 prep（S7 等值/真值条件）
  - source: prepare_check
    target: pe_info
    condition: 'prepare_check_result.current_device'
  - source: prepare_check
    target: prep
    condition: "prepare_check_result.current_device == ''"
  - source: pe_info
    target: pick_vendor
  - source: pick_vendor
    target: command_exec
  - source: command_exec
    target: parse_result
  # 循环回边：还有告警 → 回 prepare_check 弹下一条；否则出环
  - source: parse_result
    target: prepare_check
    condition: "has_next == 'true'"
  - source: parse_result
    target: prep
    condition: "has_next == 'false'"
  - source: prep
    target: llm_summary
  - source: llm_summary
    target: report
  - source: report
    target: END
